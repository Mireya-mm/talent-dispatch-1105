# 工程唯一配置入口：所有地址、模型名、权限、红线都在这里，代码里不写死。  # noqa
# 注意：D:/ollama/config.yaml 只是安装期产物，本工程只读仓库根这一份。      # noqa
app:                                          # 应用自身配置段
  name: "派遣岗位需求与到岗交接业务核对助手"    # 服务名，出现在 /health
  version: "0.1.0"                            # 版本，随阶段递增
  env: "synthetic-training"                   # 环境标识：合成演练，非生产

server:                                       # FastAPI 运行配置
  host: "127.0.0.1"                           # 只监听本机，不对公网暴露
  port: 8000                                  # 服务端口
  reload: false                               # 不启用热重载，避免演练环境误重启

ollama:                                       # 本地模型配置
  base_url: "http://127.0.0.1:11434"          # 本地服务地址，不出网
  model: "fsg-assign-check:0.8b"              # 项目专用模型
  base_model: "qwen3.5:0.8b"                  # 基座模型，仅用于 /models 展示
  timeout_seconds: 60                         # 单次调用超时，超时转人工队列
  temperature: 0.1                            # 低温度，减少小模型自由发挥
  num_ctx: 4096                               # 上下文窗口
  num_predict: 2048                           # 输出上限，注入 RAG 证据后输出变长，须留够否则 JSON 被截断
  think: false                                # 关键：Qwen3.5 默认思考会吃光 token
  format: "json"                              # 要求结构化输出，便于 schema 校验

guardrails:                                   # 数据红线（硬约束，代码层无写回通道）
  read_only: true                             # 只处理脱敏只读导出
  auto_writeback: false                       # 禁止自动回写需求单
  auto_decide: false                          # 禁止自动决定录用或派遣资格
  send_to_real_person: false                  # 禁止向真实人员发送安排
  model_has_approval: false                   # 模型没有审批权
  unconfirmed_to_human_queue: true            # 版本/关键字段确认不了转人工
  require_source_per_item: true               # 每条结果必须挂来源位置
  synthetic_sample_as_baseline: false         # f12 虚构样本不作基线

permissions:                                  # 权限矩阵：角色 -> 允许的动作
  frontline:                                  # 一线（服务专员/到岗协调）
    read: true                                # 只读
    submit_change: true                       # 可提交变更
    confirm_version: false                    # 不能确认版本
    halt: false                               # 不能叫停
  business_owner:                             # 业务负责人
    read: true                                # 只读
    submit_change: true                       # 可提交变更
    confirm_version: true                     # 可确认版本
    halt: false                               # 不能叫停
  quality_review:                             # 质量复核
    read: true                                # 只读并看复核记录
    submit_change: false                      # 不提交变更
    confirm_version: false                    # 不确认版本
    halt: true                                # 可叫停
  client_site:                                # 客户现场
    read: true                                # 只看结果用途
    submit_change: false                      # 不提交变更
    confirm_version: false                    # 不确认版本
    halt: false                               # 不能叫停
  admin:                                      # 管理员（SaaS 运营方，非业务审批人）
    read: true                                # 可查看全部只读数据
    submit_change: false                      # 不提交业务变更（与业务负责人分离）
    confirm_version: false                    # 不能确认业务版本（红线：确认权归业务负责人）
    halt: true                                # 可叫停整批
    manage_users: true                        # 可建/禁用用户、改角色
    lock_pilot: true                          # 可锁定试点清单
    view_audit: true                          # 可查看审计日志

pilot:                                        # 试点范围
  batch_id: "PILOT-1105-01"                   # 批次号，演练用
  position_list: []                           # 试点岗位清单，业务负责人锁定前为空
  lock_required: true                         # 清单为空则整批暂停，不默认全量

harness:                                      # Harness 回归评测配置
  prompt_version: "v0.1"                      # 提示词版本，改动后必须重跑回归
  zero_tolerance_cases:                       # 零容忍用例：未确认误判为已确认
    - "P1_unconfirmed_as_confirmed"           # 用例标识
  min_recall: 1.0                             # 缺项召回率下限（固定样本）
  min_source_traceability: 1.0                # 来源可追溯率下限

knowledge:                                    # 知识库（SQLite，只读运行时，标准库 sqlite3）
  db_path: "data/knowledge.db"                # 数据库文件路径，相对仓库根
  search_top_k: 3                             # RAG 检索返回条数
  min_bigram_overlap: 0.12                    # bigram 重合度阈值，低于视为不相关（fail-closed）
  seed_notice: "合成演练样本，非真实业务，不作基线"  # 数据声明，随检索结果返回

auth:                                         # 登录鉴权（标准库 hashlib/hmac，无第三方依赖）
  db_path: "data/auth.db"                     # 用户与审计数据库，独立于知识库
  token_secret: "synthetic-demo-secret-change-in-prod"  # 演练密钥，生产必须替换
  token_ttl_seconds: 28800                    # token 有效期 8 小时
  pbkdf2_iterations: 120000                   # 密码哈希迭代次数
  bootstrap_admin: "admin"                    # 初始管理员账号（首次初始化时创建）
  bootstrap_password: "ChangeMe@1105"         # 初始口令，演练用，首次登录后应改
