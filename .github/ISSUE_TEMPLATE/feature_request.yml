name: 功能建议
description: 提出新能力、新接口或流程改进（须守住只读与人工确认红线）
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提建议前请先确认不触碰仓库红线：不写回业务系统、不自动决定录用或派遣资格、不向真实人员发送安排、模型不做审批。
  - type: textarea
    id: background
    attributes:
      label: 背景与痛点
      description: 现在卡在哪一步？谁受影响（一线 / 业务负责人 / 质量复核 / 客户现场 / 管理员）？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的行为或接口形态；如涉及接口，请写出方法、路径、请求体与统一响应 data 结构。
      placeholder: |
        例如：GET /v1/positions/{code}/versions 返回该岗位全部规则版本及生效区间。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代做法
      description: 为什么现成的接口或确定性规则不够用。
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 核对主链路 /v1/check
        - 知识库与版本规则
        - 鉴权与权限矩阵
        - 人工确认闸门
        - 前端演示页
        - 文档 / 脚本
    validations:
      required: true
  - type: checkboxes
    id: redline
    attributes:
      label: 红线自查
      options:
        - label: 该建议不要求写回业务系统
          required: true
        - label: 该建议不要求模型做自动决策或审批
          required: true
        - label: 该建议不要求向真实人员发送安排
          required: true
